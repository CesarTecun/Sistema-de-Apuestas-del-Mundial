services:
  - type: web
    name: marcador-service
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8001
      - key: CORS_ORIGINS
        sync: false
      - key: DJANGO_WEBHOOK_URL
        sync: false
