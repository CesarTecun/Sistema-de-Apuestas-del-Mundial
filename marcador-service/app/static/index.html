<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcador de Fútbol - Mundial 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Marcador de Fútbol</h1>
            <p>Microservicio de marcadores en vivo</p>
        </header>

        <div class="controls">
            <button id="refreshBtn" class="btn btn-primary">Actualizar</button>
            <button id="createMatchBtn" class="btn btn-success">Nuevo Partido</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="live">En Vivo</button>
            <button class="tab" data-tab="scheduled">Programados</button>
            <button class="tab" data-tab="finished">Finalizados</button>
            <button class="tab" data-tab="teams">Selecciones</button>
        </div>

        <div id="content" class="content">
            <div id="live" class="tab-content active">
                <h2>Partidos en Vivo</h2>
                <div id="liveMatches" class="matches-grid"></div>
            </div>

            <div id="scheduled" class="tab-content">
                <h2>Partidos Programados</h2>
                <div id="scheduledMatches" class="matches-grid"></div>
            </div>

            <div id="finished" class="tab-content">
                <h2>Partidos Finalizados</h2>
                <div id="finishedMatches" class="matches-grid"></div>
            </div>

            <div id="teams" class="tab-content">
                <h2>Selecciones</h2>
                <div id="teamsList" class="teams-grid"></div>
            </div>
        </div>

        <!-- Modal para crear partido -->
        <div id="matchModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Crear Nuevo Partido</h2>
                <form id="matchForm">
                    <div class="form-group">
                        <label>Equipo Local:</label>
                        <select id="localTeam" required></select>
                    </div>
                    <div class="form-group">
                        <label>Equipo Visitante:</label>
                        <select id="visitorTeam" required></select>
                    </div>
                    <div class="form-group">
                        <label>Fecha y Hora:</label>
                        <input type="datetime-local" id="matchDate" required>
                    </div>
                    <button type="submit" class="btn btn-success">Crear Partido</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
