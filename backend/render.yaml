services:
  - type: web
    name: backend-mundial
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ../manage.py migrate --fake-initial && gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
